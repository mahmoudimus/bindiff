[build-system]
requires = [
    "setuptools>=65.0",
    "wheel",
    "Cython>=3.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "bindiff"
version = "8.0.0"
description = "Python bindings to the BinDiff engine, plus an IDA plugin"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC"}
]
keywords = ["binary", "diff", "reverse-engineering", "malware-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Programming Language :: C++",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

# protobuf is genuinely required, not optional: bindiff.binexport and
# bindiff.metadata parse .BinExport files and metadata sidecars with it. Only
# the compiled extension needs nothing.
dependencies = ["protobuf>=4.25"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.990",
]

ui = [
    "PySide6>=6.0",
]

# Only the sidecar producers learn anything; the differ never runs a model.
# Optional so that installing the package does not pull several hundred
# megabytes nobody asked for.
embeddings = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/mahmoudimus/bindiff"
Repository = "https://github.com/mahmoudimus/bindiff"
Issues = "https://github.com/mahmoudimus/bindiff/issues"

[tool.setuptools]
# bindiff._pb holds the generated protobuf bindings, which are built rather
# than checked in, so they are not found by package discovery. ida_plugin is
# the IDA-side UI: the plugin imports it, and shipping one without the other
# leaves a plugin that cannot start.
packages = ["bindiff", "bindiff._pb", "ida_plugin"]

[tool.setuptools.package-data]
bindiff = ["*.pxd", "*.pyx"]
"bindiff._pb" = ["*.py", "*.pyi"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

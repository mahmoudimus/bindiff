[build-system]
requires = [
    # 77 is the floor for PEP 639: a plain SPDX string for `license` and a
    # `license-files` glob. The table form it replaces is removed in
    # 2027-Feb, and the table form shipped no license file at all -- only a
    # metadata field -- which Apache-2.0 section 4(a) asks for.
    "setuptools>=77",
    "wheel",
    "Cython>=3.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "bindiff-ng"
version = "8.1.0"
description = "Python bindings to the BinDiff engine, plus an IDA plugin"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
# A copy of python/LICENSE, which is the root LICENSE: license-files globs are
# resolved against the project directory and cannot reach outside it, and the
# wheel is the artefact that has to carry the text.
license-files = ["LICENSE"]
# Google wrote BinDiff and holds the copyright on the engine this builds
# against; the fork and its bindings are maintained separately. Splitting the
# two fields says that, where a single authors list would have claimed one or
# misattributed the other.
authors = [
    {name = "Google LLC"}
]
maintainers = [
    {name = "Mahmoud Abdelkader", email = "mabdelkader@gmail.com"}
]
keywords = ["binary", "diff", "reverse-engineering", "malware-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: C++",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

# protobuf is genuinely required, not optional: bindiff.binexport and
# bindiff.metadata parse .BinExport files and metadata sidecars with it. Only
# the compiled extension needs nothing.
dependencies = ["protobuf>=4.25"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.990",
]

ui = [
    "PySide6>=6.0",
]

# Only the sidecar producers learn anything; the differ never runs a model.
# Optional so that installing the package does not pull several hundred
# megabytes nobody asked for.
embeddings = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/mahmoudimus/bindiff-ng"
Repository = "https://github.com/mahmoudimus/bindiff-ng"
Issues = "https://github.com/mahmoudimus/bindiff-ng/issues"

[tool.setuptools]
# bindiff._pb holds the generated protobuf bindings, which are built rather
# than checked in, so they are not found by package discovery. ida_plugin is
# the IDA-side UI: the plugin imports it, and shipping one without the other
# leaves a plugin that cannot start.
packages = ["bindiff", "bindiff._pb", "ida_plugin"]

[tool.setuptools.package-data]
bindiff = ["*.pxd", "*.pyx"]
"bindiff._pb" = ["*.py", "*.pyi"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

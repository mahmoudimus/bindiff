name: Release

on:
    push:
        tags:
            - "v*" # Push events to matching v*, i.e. v8.0, v8.1.0
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag name (e.g. v8.0.0). If empty, will use latest."
                required: false
                default: ""

# Make concurrency tag-aware
concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    debug-vars:
        runs-on: ubuntu-latest
        steps:
            - name: Look at environment variables
              run: |
                  echo "GITHUB_REF=${{ github.ref }}"
                  echo "GITHUB_SHA=${{ github.sha }}"
                  echo "GITHUB_EVENT_NAME=${{ github.event_name }}"
                  echo "GITHUB_EVENT_INPUTS_TAG=${{ github.event.inputs.tag }}"

    build-release:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, macos-13, windows-2022]
                python-version: ["3.10", "3.11", "3.12"]

        steps:
            - name: Extract version from tag
              id: version
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
                    TAG="${{ github.event.inputs.tag }}"
                    TAG="${TAG#refs/tags/}"
                  else
                    TAG="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "version=${TAG#v}" >> $GITHUB_OUTPUT

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  path: bindiff
                  submodules: recursive
                  ref: ${{ steps.version.outputs.tag }}

            - name: Checkout BinExport
              uses: actions/checkout@v4
              with:
                  repository: google/binexport
                  path: binexport

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install CMake
              uses: lukka/get-cmake@latest

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install Cython>=3.0 setuptools wheel build

            - name: Build BinDiff (Linux)
              if: runner.os == 'Linux'
              run: |
                  cd bindiff
                  mkdir -p build && cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . -j$(nproc)

            - name: Build BinDiff (macOS)
              if: runner.os == 'macOS'
              run: |
                  cd bindiff
                  mkdir -p build && cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . -j$(sysctl -n hw.ncpu)

            - name: Build BinDiff (Windows)
              if: runner.os == 'Windows'
              run: |
                  cd bindiff
                  mkdir build
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . --config Release

            - name: Build Python wheel
              run: |
                  cd bindiff/python
                  python -m build --wheel --no-isolation

            - name: Create IDA plugin standalone file
              shell: bash
              run: |
                  cd bindiff/python
                  cp ida_plugin/bindiff_plugin.py bindiff_plugin_${{ steps.version.outputs.version }}.py

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}-${{ steps.version.outputs.version }}
                  path: bindiff/python/dist/*.whl

            - name: Upload IDA plugin
              uses: actions/upload-artifact@v4
              with:
                  name: ida-plugin-${{ matrix.os }}-${{ steps.version.outputs.version }}
                  path: bindiff/python/bindiff_plugin_${{ steps.version.outputs.version }}.py

    create-release:
        needs: build-release
        runs-on: ubuntu-latest
        steps:
            - name: Extract version from tag
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
                    TAG="${{ github.event.inputs.tag }}"
                    TAG="${TAG#refs/tags/}"
                  else
                    TAG="${GITHUB_REF#refs/tags/}"
                  fi
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "version=${TAG#v}" >> $GITHUB_OUTPUT

            - name: Check if release exists
              id: guard
              run: |
                  if gh api repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }} >/dev/null 2>&1; then
                    echo "already=true" >> $GITHUB_OUTPUT
                  else
                    echo "already=false" >> $GITHUB_OUTPUT
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download all artifacts
              if: steps.guard.outputs.already == 'false'
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Prepare release files
              if: steps.guard.outputs.already == 'false'
              run: |
                  mkdir release-files
                  find artifacts -name "*.whl" -exec cp {} release-files/ \;
                  find artifacts -name "bindiff_plugin_*.py" | head -1 | xargs -I{} cp {} release-files/

            - name: Create release body
              if: steps.guard.outputs.already == 'false'
              run: |
                  cat > release_body.md << 'EOF'
                  # BinDiff Python Interface v${{ steps.version.outputs.version }}

                  ## What's Included

                  ### Standalone Python Package
                  Python wheels for multiple platforms:
                  - Linux (x86_64)
                  - macOS (x86_64, ARM64)
                  - Windows (x86_64)

                  Install with:
                  ```bash
                  pip install bindiff-${{ steps.version.outputs.version }}-*.whl
                  ```

                  ### IDA Pro Plugin (Python)
                  Complete IDA plugin written in Python/Cython:
                  - File: `bindiff_plugin_${{ steps.version.outputs.version }}.py`
                  - Copy to IDA's plugins directory
                  - Press Ctrl+6 to use

                  ## Features

                  **Standalone API:**
                  - Diff binaries from Python scripts
                  - Load and analyze BinDiff databases
                  - Export to various formats
                  - PySide6 GUI support

                  **IDA Plugin:**
                  - View matched/unmatched functions
                  - Add manual matches
                  - Port comments and symbols
                  - Incremental diffing
                  - Visual diff preparation

                  ## Documentation

                  - [Python API README](https://github.com/${{ github.repository }}/blob/main/python/README.md)
                  - [IDA Plugin README](https://github.com/${{ github.repository }}/blob/main/python/ida_plugin/README.md)
                  - [Architecture](https://github.com/${{ github.repository }}/blob/main/python/ARCHITECTURE.md)
                  - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/python/INSTALL.md)

                  ## Requirements

                  - Python 3.10+
                  - Cython 3.0+
                  - IDA Pro 8.2+ (for IDA plugin only)

                  ## License

                  Apache License 2.0
                  EOF

                  echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
                  cat release_body.md >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Generate Release
              if: steps.guard.outputs.already == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  files: release-files/*
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: BinDiff Python Interface ${{ steps.version.outputs.tag }}
                  body: ${{ env.RELEASE_BODY }}
                  draft: false
                  generate_release_notes: true
                  prerelease: ${{ contains(steps.version.outputs.version, '-') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

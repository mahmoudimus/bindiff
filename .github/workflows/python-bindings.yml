name: Build Python Bindings

on:
    push:
        branches:
            - "main"
            - "claude/**"
    pull_request:
        types:
            - synchronize
            - opened
            - reopened
            - ready_for_review
        branches:
            - "main"

# Cancel previous workflow jobs for PRs
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    build-standalone:
        name: Build Standalone Python Package
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, macos-13, windows-2022]
                python-version: ["3.10", "3.11", "3.12"]

        steps:
            - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Checkout BinExport
              uses: actions/checkout@v4
              with:
                  repository: google/binexport
                  path: binexport
                  persist-credentials: false

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install CMake
              uses: lukka/get-cmake@latest

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install Cython>=3.0 setuptools wheel build

            - name: Build BinDiff (Linux)
              if: runner.os == 'Linux'
              run: |
                  mkdir -p build && cd build
                  cmake .. \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . -j$(nproc)

            - name: Build BinDiff (macOS)
              if: runner.os == 'macOS'
              run: |
                  mkdir -p build && cd build
                  cmake .. \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . -j$(sysctl -n hw.ncpu)

            - name: Build BinDiff (Windows)
              if: runner.os == 'Windows'
              run: |
                  mkdir build
                  cd build
                  cmake .. `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . --config Release

            - name: Build Python bindings
              run: |
                  cd python
                  python -m build --wheel --no-isolation
              env:
                  DEBUG: "0"

            - name: Test import
              run: |
                  cd python
                  pip install dist/*.whl
                  python -c "import bindiff; print(f'BinDiff version: {bindiff.__version__}')"

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
                  path: python/dist/*.whl
                  retention-days: 7

    build-ida-plugin:
        name: Build IDA Plugin (Standalone Mode)
        runs-on: ubuntu-22.04
        strategy:
            matrix:
                python-version: ["3.10"]

        steps:
            - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  persist-credentials: false

            - name: Checkout BinExport
              uses: actions/checkout@v4
              with:
                  repository: google/binexport
                  path: binexport
                  persist-credentials: false

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install CMake
              uses: lukka/get-cmake@latest

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install Cython>=3.0 setuptools wheel build

            - name: Build BinDiff
              run: |
                  mkdir -p build && cd build
                  cmake .. \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DBINDIFF_BUILD_TESTING=OFF
                  cmake --build . -j$(nproc)

            - name: Build Python bindings (standalone mode)
              run: |
                  cd python
                  python setup.py build_ext --inplace
                  pip install -e .

            - name: Test IDA plugin imports
              run: |
                  cd python
                  python -c "from bindiff.ida_plugin import BindiffResults, Match, PortCommentsKind"
                  python -c "print('IDA plugin bindings imported successfully')"

            - name: Create plugin package
              run: |
                  cd python
                  mkdir -p bindiff-plugin
                  cp ida_plugin/bindiff_plugin.py bindiff-plugin/
                  cp ida_plugin/README.md bindiff-plugin/
                  cp -r bindiff bindiff-plugin/
                  tar -czf bindiff-ida-plugin.tar.gz bindiff-plugin

            - name: Upload plugin package
              uses: actions/upload-artifact@v4
              with:
                  name: bindiff-ida-plugin
                  path: python/bindiff-ida-plugin.tar.gz
                  retention-days: 7

    test-imports:
        name: Test Python Imports
        needs: build-standalone
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, macos-13, windows-2022]
                python-version: ["3.10"]

        steps:
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
                  path: dist

            - name: Install wheel
              shell: bash
              run: |
                  pip install dist/*.whl

            - name: Test basic import
              run: |
                  python -c "import bindiff"
                  python -c "from bindiff import diff, Results"
                  python -c "print('Import test passed')"

name: Build wheels

# Builds installable wheels for the Python bindings and the IDA plugin, on
# every platform they are meant to run on. Publishes nothing.
#
# Separate from release.yml on purpose: a release should never be the first
# time this build has executed. The Cython step has only ever run on Linux --
# setup.py discovers its include paths from compile_commands.json and its link
# line by walking the CMake tree for archives, and neither has been exercised
# with MSVC. Run this from a branch first and read the artifacts.
#
# The wheels are self-hosted rather than published to PyPI, so
# tools/scripts/plugin_dependencies.py turns them into PEP 508 direct
# references for ida-plugin.json. See that file for why an index would not
# work with hcli.

on:
    # Called by release.yml, so a release ships artifacts built by the same
    # workflow that was exercised from a branch first.
    workflow_call:
    workflow_dispatch:
        inputs:
            platforms:
                description: "Which platforms to build"
                required: false
                default: "all"
                type: choice
                options: ["all", "linux", "macos", "windows"]
    pull_request:
        types: [synchronize, opened, reopened, ready_for_review]
        paths:
            - "python/**"
            - "CMakeLists.txt"
            - ".github/workflows/wheels.yml"

# Prefixed rather than keyed on github.workflow alone: in a called workflow
# that expression resolves to the *caller's* name, so on a release this would
# compute the same group as release.yml -- the caller holding the group while
# waiting for the callee that is queued behind it, and with the two disagreeing
# about cancel-in-progress. Not something measured here; release.yml has never
# run. The prefix costs nothing and removes the question.
concurrency:
    group: wheels-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    BUILD_TYPE: Release

jobs:
    build:
        name: ${{ matrix.name }} py${{ matrix.python }}
        runs-on: ${{ matrix.runs-on }}
        # Linux builds inside manylinux; macOS and Windows pass an empty
        # string, which is no container. The glibc a wheel demands is the one
        # it was *compiled* against, not the one auditwheel finds afterwards --
        # built on ubuntu-24.04 the extension linked GLIBC_2.38 symbols and
        # auditwheel could only tag it manylinux_2_39, which installs on
        # Ubuntu 24.04 and essentially nothing else. Ubuntu 22.04 (2.35),
        # Debian 12 (2.36) and RHEL 9 (2.34) all got "no matching
        # distribution". Compiling against glibc 2.28 is what actually lowers
        # the floor.
        container: ${{ matrix.container }}
        # Nothing here legitimately takes this long; the default is six hours,
        # and a hang has already burned two runs' worth of Windows minutes.
        timeout-minutes: 45
        strategy:
            # One platform failing must not hide the others: the point of this
            # workflow is to find out which ones work.
            fail-fast: false
            # Every leg is spelled out in `include` with no base matrix keys
            # alongside it. An `include` entry whose keys do not collide with a
            # base key is *merged into* each existing combination rather than
            # adding a job -- so `python: ["3.13"]` here plus four includes
            # produced exactly one job carrying the last entry's values, and
            # three platforms silently never ran.
            matrix:
                include:
                    - name: linux-x86_64
                      runs-on: ubuntu-24.04
                      family: linux
                      python: "3.13"
                      container: quay.io/pypa/manylinux_2_28_x86_64
                    - name: linux-aarch64
                      runs-on: ubuntu-24.04-arm
                      family: linux
                      python: "3.13"
                      container: quay.io/pypa/manylinux_2_28_aarch64
                    - name: macos-arm64
                      runs-on: macos-15
                      family: macos
                      python: "3.13"
                      container: ""
                    - name: windows-x86_64
                      runs-on: windows-2025
                      family: windows
                      python: "3.13"
                      container: ""
        steps:
            - name: Skip unselected platform
              id: gate
              shell: bash
              run: |
                  want="${{ inputs.platforms || 'all' }}"
                  if [ "$want" = "all" ] || [ "$want" = "${{ matrix.family }}" ]; then
                    echo "run=yes" >> "$GITHUB_OUTPUT"
                  else
                    echo "run=no" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v4
              if: steps.gate.outputs.run == 'yes'
              with:
                  persist-credentials: false

            - name: Checkout BinExport
              if: steps.gate.outputs.run == 'yes'
              uses: actions/checkout@v4
              with:
                  repository: google/binexport
                  path: build/binexport
                  persist-credentials: false

            - name: Set up MSVC
              if: steps.gate.outputs.run == 'yes' && runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Install CMake and Ninja
              if: steps.gate.outputs.run == 'yes'
              uses: lukka/get-cmake@latest
              with:
                  cmakeVersion: "~4.4.0"
                  ninjaVersion: "~1.13.1"

            # manylinux ships its interpreters under /opt/python and
            # actions/setup-python cannot install into the image, so the
            # container legs put the right one on PATH and every later step
            # picks it up from there.
            - name: Use the manylinux interpreter
              if: steps.gate.outputs.run == 'yes' && matrix.container != ''
              shell: bash
              run: |
                  tag="cp${{ matrix.python }}"
                  tag="${tag//./}"
                  prefix="/opt/python/${tag}-${tag}/bin"
                  if [ ! -x "$prefix/python" ]; then
                    echo "::error::no interpreter at $prefix/python"
                    ls /opt/python
                    exit 1
                  fi
                  echo "$prefix" >> "$GITHUB_PATH"
                  "$prefix/python" -V

            - name: Set up Python ${{ matrix.python }}
              if: steps.gate.outputs.run == 'yes' && matrix.container == ''
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            # CMAKE_EXPORT_COMPILE_COMMANDS is what setup.py reads its include
            # paths from, so a build without it falls back to a hardcoded list
            # that has gone stale before. Testing is off: the wheel does not
            # need the test binaries and they are a large part of the build.
            - name: Configure and build the engine
              if: steps.gate.outputs.run == 'yes'
              working-directory: build
              shell: bash
              run: |
                  cmake "${GITHUB_WORKSPACE}" -G Ninja \
                    "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" \
                    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON" \
                    "-DBINDIFF_BINEXPORT_DIR=${GITHUB_WORKSPACE}/build/binexport" \
                    "-DBINEXPORT_ENABLE_IDAPRO=OFF"
                  cmake --build . --config "${BUILD_TYPE}"

            - name: Install build tooling
              if: steps.gate.outputs.run == 'yes'
              shell: bash
              run: python -m pip install --disable-pip-version-check
                   build wheel "Cython>=3.0" setuptools protobuf

            # Generated, never checked in -- python/bindiff/_pb does not exist
            # in a fresh checkout, and pyproject.toml names bindiff._pb as a
            # package, so setuptools fails outright without this. The protoc
            # used is the one the CMake build just produced, so the bindings
            # always match the schema in the tree. Same two protos the docker
            # harness generates.
            - name: Generate the protobuf bindings
              if: steps.gate.outputs.run == 'yes'
              shell: bash
              run: |
                  protoc="${GITHUB_WORKSPACE}/build/_deps/protobuf-build/protoc"
                  [ -x "$protoc" ] || protoc="$protoc.exe"
                  [ -x "$protoc" ] || {
                    echo "::error::no protoc under build/_deps/protobuf-build"
                    find "${GITHUB_WORKSPACE}/build/_deps" -name 'protoc*' \
                      -maxdepth 3 2>/dev/null | sed -n '1,10p'
                    exit 1
                  }
                  mkdir -p python/bindiff/_pb
                  touch python/bindiff/_pb/__init__.py
                  "$protoc" --proto_path="${GITHUB_WORKSPACE}/build/binexport" \
                    --python_out=python/bindiff/_pb binexport2.proto
                  "$protoc" --proto_path="${GITHUB_WORKSPACE}" \
                    --python_out=python/bindiff/_pb bindiff_metadata.proto
                  ls -l python/bindiff/_pb

            # protoc stamps the version that generated each module and the
            # runtime refuses gencode newer than itself, so the floor in
            # pyproject.toml has to cover whatever the CMake build's protoc
            # just emitted. v8.1.1 shipped gencode 7.35.1 behind a declared
            # protobuf>=4.25 and every install resolving 4, 5 or 6 died on
            # import -- invisible here because this job installs the newest
            # protobuf, the one case that works.
            - name: Check the protobuf floor covers the bindings
              if: steps.gate.outputs.run == 'yes'
              shell: bash
              run: |
                  python -m pip install --disable-pip-version-check packaging
                  python tools/scripts/check_protobuf_floor.py \
                    --pb python/bindiff/_pb \
                    --pyproject python/pyproject.toml

            # Unbuffered and flushed: a probe whose output sits in a pipe
            # buffer tells you nothing when the step is killed for taking too
            # long, which is exactly when you need it. The same reason
            # bindiff.headless.emit_progress flushes every line.
            - name: Time the build-tree scan
              if: steps.gate.outputs.run == 'yes'
              working-directory: python
              shell: bash
              env:
                  BINDIFF_BUILD_DIR: ${{ github.workspace }}/build
              run: |
                  python -u - <<'SCAN'
                  import os, sys, time
                  from pathlib import Path
                  src = open("setup.py").read()
                  ns = {"os": os, "Path": Path}
                  exec(src[src.index("_PRUNED_DIRS = {"):
                           src.index("library_dirs = [str(BUILD_DIR)]")], ns)
                  exec(src[src.index("def _static_libraries"):
                           src.index("_archives = _static_libraries")], ns)
                  build = Path(os.environ["BINDIFF_BUILD_DIR"])
                  t0 = time.time()
                  dirs = ns["_archive_dirs"](build)
                  print(f"archive dirs: {len(dirs)} in {time.time()-t0:.1f}s",
                        flush=True)
                  t0 = time.time()
                  archives = ns["_static_libraries"](build)
                  print(f"archives: {len(archives)} in {time.time()-t0:.1f}s",
                        flush=True)
                  for name in ("bindiff_shared", "protobuf", "sqlite"):
                      print(f"  {name}: {archives.get(name, 'MISSING')}",
                            flush=True)
                  if not archives:
                      sys.exit("no archives found; the link line would be empty")
                  SCAN

            - name: Build the wheel
              if: steps.gate.outputs.run == 'yes'
              working-directory: python
              shell: bash
              env:
                  BINDIFF_BUILD_DIR: ${{ github.workspace }}/build
                  BINDIFF_BINEXPORT_DIR: ${{ github.workspace }}/build/binexport
              run: python -m pip wheel . --no-deps --no-build-isolation -w ../dist

            # A bare linux_* wheel refuses to install anywhere but the machine
            # that built it; auditwheel rewrites the tag and vendors libstdc++.
            # macOS needs the same treatment from delocate. Windows links the
            # runtime statically and needs neither.
            - name: Make the wheel portable (Linux)
              if: steps.gate.outputs.run == 'yes' && runner.os == 'Linux'
              shell: bash
              run: |
                  python -m pip install --disable-pip-version-check auditwheel
                  mkdir -p wheelhouse
                  # Printed because the tag is the whole point of building in
                  # the container, and it is derived rather than declared: a
                  # base image change would move it silently otherwise.
                  #
                  # sed rather than head: this shell runs with -o pipefail, and
                  # head closes the pipe after one line, so ldd takes a SIGPIPE
                  # and the step fails with 141. sed reads the stream to the
                  # end. Any `... | head` in a workflow step is this bug.
                  ldd --version | sed -n '1p'
                  for whl in dist/*.whl; do
                    auditwheel repair "$whl" -w wheelhouse || {
                      echo "::warning::auditwheel could not repair $whl; \
                            keeping the unrepaired wheel"
                      cp "$whl" wheelhouse/
                    }
                  done

            - name: Make the wheel portable (macOS)
              if: steps.gate.outputs.run == 'yes' && runner.os == 'macOS'
              shell: bash
              run: |
                  python -m pip install --disable-pip-version-check delocate
                  mkdir -p wheelhouse
                  delocate-wheel -w wheelhouse -v dist/*.whl || cp dist/*.whl wheelhouse/

            - name: Keep the wheel as built (Windows)
              if: steps.gate.outputs.run == 'yes' && runner.os == 'Windows'
              shell: bash
              run: mkdir -p wheelhouse && cp dist/*.whl wheelhouse/

            # A wheel with two extensions in it is not obviously broken: pip
            # installs it, and CPython silently prefers the version-specific
            # name over the abi3 one, so the module that loads is whichever
            # stale artefact was lying in the source tree or in setuptools'
            # build/lib staging directory. That shipped a wheel here whose
            # abi3 module was correct and whose cpython-313 module crashed in
            # absl's hashtable destructor, on 3.13 only. A count is the whole
            # check.
            - name: The wheel must ship exactly one extension
              if: steps.gate.outputs.run == 'yes'
              shell: bash
              run: |
                  python - wheelhouse/*.whl <<'CHECK'
                  import sys, zipfile
                  failed = False
                  for path in sys.argv[1:]:
                      found = [n for n in zipfile.ZipFile(path).namelist()
                               if n.endswith((".so", ".pyd", ".dylib"))]
                      print(f"{path}:")
                      for name in found:
                          print(f"    {name}")
                      if len(found) != 1:
                          print(f"::error::{path} ships {len(found)} "
                                "extensions; exactly one is expected")
                          failed = True
                  sys.exit(1 if failed else 0)
                  CHECK

            # The property an abi3 wheel exists for, checked rather than
            # assumed: it has to load on interpreters it was never built
            # against. Only the manylinux image carries several, and they are
            # already there, so this runs where it is free. Free-threaded
            # builds are skipped -- Py_GIL_DISABLED is a different ABI and pip
            # correctly refuses an abi3 wheel on it.
            # The property an abi3 wheel exists for, checked rather than
            # assumed: it has to load on interpreters it was never built
            # against. Only the manylinux image carries several, and they are
            # already there, so this runs where it is free.
            #
            # Below the floor the wheel must be *refused*. That half is not
            # ceremony -- a floor nothing enforces is how the protobuf
            # dependency shipped wrong -- and the image conveniently ships a
            # cp39 to prove it with. Free-threaded builds are skipped:
            # Py_GIL_DISABLED is a different ABI and pip is right to refuse an
            # abi3 wheel there, which would read as a floor violation.
            - name: Load the wheel on every interpreter in the image
              if: steps.gate.outputs.run == 'yes' && matrix.container != ''
              shell: bash
              run: |
                  loaded=0
                  refused=0
                  for prefix in /opt/python/cp3*-cp3*; do
                    case "$prefix" in *t) continue;; esac
                    py="$prefix/bin/python"
                    [ -x "$py" ] || continue
                    ver=$("$py" -c 'import sys;print("%d.%d"%sys.version_info[:2])')
                    minor=${ver#3.}
                    rm -rf /tmp/probe
                    "$py" -m venv /tmp/probe
                    if /tmp/probe/bin/python -m pip install \
                         --disable-pip-version-check -q wheelhouse/*.whl \
                         >/tmp/probe.log 2>&1; then
                      if [ "$minor" -lt 10 ]; then
                        echo "::error::python $ver installed a wheel whose \
                              declared floor is 3.10"
                        exit 1
                      fi
                      /tmp/probe/bin/python -c "
                  import bindiff, bindiff.core, pathlib
                  print('  python $ver loads', pathlib.Path(bindiff.core.__file__).name,
                        '| diff:', callable(bindiff.diff))
                  "
                      loaded=$((loaded + 1))
                    else
                      if [ "$minor" -ge 10 ]; then
                        echo "::error::python $ver refused the wheel"
                        tail -3 /tmp/probe.log
                        exit 1
                      fi
                      echo "  python $ver correctly refused (below the floor)"
                      refused=$((refused + 1))
                    fi
                  done
                  if [ "$loaded" -lt 2 ]; then
                    echo "::error::only $loaded interpreters loaded it; the \
                          stable-ABI claim is untested"
                    exit 1
                  fi
                  echo "loaded on $loaded interpreters, refused by $refused below the floor"

            # Installing it and importing from somewhere else entirely is the
            # only check that matters: a wheel that builds but ships no
            # extension, or ships one that cannot load, looks fine until this.
            - name: Install it and use it
              if: steps.gate.outputs.run == 'yes'
              shell: bash
              run: |
                  python -m venv /tmp/verify || python -m venv "$RUNNER_TEMP/verify"
                  venv="/tmp/verify"; [ -d "$venv" ] || venv="$RUNNER_TEMP/verify"
                  bin="$venv/bin"; [ -d "$bin" ] || bin="$venv/Scripts"
                  "$bin/python" -m pip install --disable-pip-version-check wheelhouse/*.whl
                  cd "$HOME"
                  "$bin/python" -c "
                  import bindiff, ida_plugin.diff_runner
                  from bindiff._pb import binexport2_pb2
                  print('bindiff', bindiff.__version__, 'from', bindiff.__file__)
                  print('extension callable:', callable(bindiff.diff))
                  print('protobuf bindings:', binexport2_pb2.BinExport2 is not None)
                  "

            - name: Upload
              if: steps.gate.outputs.run == 'yes'
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.name }}-py${{ matrix.python }}
                  path: wheelhouse/*.whl
                  if-no-files-found: error

name: IDA Plugin Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-ida-plugin:
    name: Test IDA Plugin in Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["idapro-tests", "idapro-tests-9.2"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: bindiff

      - name: Checkout BinExport
        uses: actions/checkout@v4
        with:
          repository: google/binexport
          path: binexport

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Build BinDiff
        run: |
          cd bindiff
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBINDIFF_BUILD_TESTING=OFF
          cmake --build . -j2

      - name: Build Python bindings
        run: |
          cd bindiff/python
          # Use Python 3.10 to build (must match IDA Docker image Python version)
          python3.10 -m pip install Cython>=3.0 setuptools wheel
          python3.10 setup.py build_ext --inplace

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-image-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('bindiff/python/docker-compose.yml') }}
          restore-keys: |
            docker-image-${{ runner.os }}-${{ matrix.service }}-

      - name: Load cached Docker image if cache exists
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "Loading Docker image from cache..."
          docker load -i /tmp/docker-cache/${{ matrix.service }}.tar || echo "No cached image to load."

      - name: Run IDA plugin tests (${{ matrix.service }})
        run: |
          cd bindiff/python
          # Debug: show what we're mounting
          echo "=== Testing with ${{ matrix.service }} ==="
          echo "=== Built plugin files ==="
          ls -la bindiff/
          echo ""
          echo "=== Test files ==="
          ls -la tests/
          echo ""
          # Run the tests with better error output
          docker compose run --rm --entrypoint bash ${{ matrix.service }} -c "
            echo '=== Inside container ==='
            echo 'IDA Service: ${{ matrix.service }}'
            echo 'Plugin directory:'
            ls -la /root/.idapro/plugins/bindiff/ || echo 'Plugin dir not found!'
            echo ''
            echo 'Working directory:'
            pwd
            ls -la
            echo ''
            echo 'Python version:'
            python --version
            echo ''
            echo 'Attempting import:'
            python -c 'import sys; sys.path.insert(0, \"/root/.idapro/plugins\"); print(sys.path); import bindiff.ida_plugin' || echo 'Import failed'
            echo ''
            echo 'Running tests:'
            python -m unittest discover tests -p 'test_*.py' -v
          "

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          echo "Caching docker image for next run..."
          mkdir -p /tmp/docker-cache
          # Get the SHA256 digest for the service image
          IMAGE_DIGEST=$(docker compose config | grep "image:" | grep "${{ matrix.service }}" | awk '{print $2}')
          echo "Saving image: $IMAGE_DIGEST"
          docker save "$IMAGE_DIGEST" -o /tmp/docker-cache/${{ matrix.service }}.tar || echo "Failed to save image."
